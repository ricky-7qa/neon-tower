name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'style.css'
      - 'engine.js'
      - 'entidades.js'
      - 'ui.js'
      - 'level-mode-config.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'neon-tower-icon.svg'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Neon Tower APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Check JavaScript syntax
        run: |
          node --check engine.js
          node --check entidades.js
          node --check ui.js
          node --check level-mode-config.js
          node --check sw.js
          node --check scripts/copy-web.mjs

      - name: Install dependencies
        run: npm install

      - name: Build and verify web assets
        run: |
          npm run build
          test -f www/index.html
          test -f www/engine.js
          test -f www/entidades.js
          test -f www/ui.js
          test -f www/level-mode-config.js
          test -f www/sw.js
          test -f www/manifest.webmanifest
          test -f www/neon-tower-icon.svg

      - name: Create or update Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neon-tower-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
