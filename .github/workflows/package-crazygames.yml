name: Build CrazyGames upload ZIP

on:
  push:
    branches:
      - crazygames-basic
    paths:
      - .github/workflows/package-crazygames.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CrazyGames-only branch
        uses: actions/checkout@v4
        with:
          ref: crazygames-basic

      - name: Validate and package game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for file in index.html style.css crazygames.css crazygames-bootstrap.js engine.js entidades.js level-mode-config.js ui.js; do
            test -s "$file"
          done
          node --check crazygames-bootstrap.js
          node --check engine.js
          node --check entidades.js
          node --check level-mode-config.js
          node --check ui.js
          grep -Fq '#menu > #tab-customization.scroll-area' crazygames.css
          grep -Fq 'overflow-y:auto !important' crazygames.css
          zip -q -X dist/Neon-Tower-CrazyGames.zip \
            index.html style.css crazygames.css crazygames-bootstrap.js \
            engine.js entidades.js level-mode-config.js ui.js
          unzip -tq dist/Neon-Tower-CrazyGames.zip
          unzip -Z1 dist/Neon-Tower-CrazyGames.zip | grep -qx 'index.html'
          test "$(unzip -Z1 dist/Neon-Tower-CrazyGames.zip | wc -l)" -eq 8
          sha256sum dist/Neon-Tower-CrazyGames.zip > dist/Neon-Tower-CrazyGames.zip.sha256
          echo "Package contents:"
          unzip -Z1 dist/Neon-Tower-CrazyGames.zip
          echo "Package size:"
          stat -c '%s bytes' dist/Neon-Tower-CrazyGames.zip
          cat dist/Neon-Tower-CrazyGames.zip.sha256

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Tower-CrazyGames-Customization-Scroll-Fix
          path: |
            dist/Neon-Tower-CrazyGames.zip
            dist/Neon-Tower-CrazyGames.zip.sha256
          if-no-files-found: error
          retention-days: 7
