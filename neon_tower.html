<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Neon Tower: Apex - Top-Down 3D</title>
  
  <!-- Ícone do jogo (Favicon SVG) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' stroke='%230ff' stroke-width='10' fill='none'/><circle cx='50' cy='50' r='15' fill='%23ff3366'/></svg>">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #010103; display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; font-family: 'Orbitron', sans-serif; color: #fff; overflow: hidden; }
    
    #app { position: relative; width: 1200px; height: 800px; max-width: 100vw; max-height: 100vh; box-shadow: 0 0 100px rgba(0, 255, 255, 0.2); border: 2px solid #0ff; background: radial-gradient(circle at 50% 50%, #0a0a1a 0%, #000 100%); border-radius: 12px; overflow: hidden; }
    canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; width: 100%; height: 100%; }
    
    /* UI ELEMENTS */
    .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; z-index: 10; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); }
    .active-layer { display: flex; }
    .hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; display: none; }
    .active-hud { display: block; }
    
    /* TOP BAR */
    .top-bar { display: flex; justify-content: space-between; padding: 15px 30px; background: linear-gradient(180deg, rgba(0,20,40,0.9) 0%, transparent 100%); font-size: 18px; font-weight: bold; pointer-events: auto; border-bottom: 1px solid rgba(0,255,255,0.2); text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    .stat-box { display: flex; flex-direction: column; align-items: center; }
    .stat-val { font-size: 24px; }
    .c-green { color: #0f0; text-shadow: 0 0 10px #0f0; } .c-gold { color: #ffd700; text-shadow: 0 0 10px #ffd700; } .c-cyan { color: #0ff; text-shadow: 0 0 10px #0ff; }
    
    /* STATS UI (BOTTOM LEFT) */
    #stats-ui { position: absolute; bottom: 20px; left: 20px; background: rgba(0, 15, 30, 0.85); border: 2px solid #0ff; border-radius: 8px; padding: 15px; width: 250px; pointer-events: none; display: flex; flex-direction: column; gap: 10px; font-size: 13px; box-shadow: 0 0 20px rgba(0, 255, 255, 0.2), inset 0 0 10px rgba(0, 255, 255, 0.1); }
    .stat-row { display: flex; justify-content: space-between; font-weight: bold; color: #fff; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 3px; }
    .stat-row:last-child { border-bottom: none; padding-bottom: 0; }

    /* TARGET UI (ABOVE STATS UI) */
    #target-ui { position: absolute; bottom: 175px; left: 20px; background: rgba(0, 15, 30, 0.85); border: 2px solid #ff3366; border-radius: 8px; padding: 15px; width: 250px; pointer-events: none; opacity: 0; transition: opacity 0.3s; box-shadow: 0 0 20px rgba(255, 51, 102, 0.3), inset 0 0 10px rgba(255, 51, 102, 0.2); }
    #target-ui.visible { opacity: 1; }
    #t-name { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;}
    #t-hp-bar { width: 100%; height: 12px; background: #333; border-radius: 6px; overflow: hidden; margin-bottom: 5px; border: 1px solid #111; }
    #t-hp-fill { height: 100%; background: linear-gradient(90deg, #ff0000, #ff3366); width: 100%; transition: width 0.1s; }
    #t-hp-text { font-size: 12px; color: #ccc; text-align: right; }

    /* SIDE UPGRADE PANEL */
    #upg-panel { position: absolute; top: 0; right: 0; width: 300px; height: 100%; background: rgba(0,5,15,0.95); border-left: 2px solid #0f0; transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); display: flex; flex-direction: column; z-index: 20; box-shadow: -10px 0 30px rgba(0,255,0,0.1); pointer-events: auto; transform: translateX(100%); }
    #upg-panel.open { transform: translateX(0); }
    
    #upg-toggle { position: absolute; left: -45px; top: 50%; transform: translateY(-50%); background: rgba(0,5,15,0.95); border: 2px solid #0f0; border-right: none; color: #0f0; padding: 20px 10px; cursor: pointer; font-weight: bold; border-radius: 10px 0 0 10px; transition: 0.3s; writing-mode: vertical-rl; text-orientation: mixed; rotate: 180deg; letter-spacing: 2px; box-shadow: -5px 0 10px rgba(0,255,0,0.1); }
    #upg-toggle:hover { background: #0f0; color: #000; box-shadow: -10px 0 20px rgba(0,255,0,0.4); }
    
    #upg-content { padding: 80px 20px 20px 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 15px; }
    .upg-btn { width: 100%; padding: 15px; font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 5px; }

    /* BUTTONS & MENUS */
    .btn { background: rgba(0,0,0,0.8); border: 1px solid #0ff; color: #0ff; padding: 12px 25px; font-family: inherit; font-weight: bold; cursor: pointer; border-radius: 6px; transition: 0.2s; text-transform: uppercase; box-shadow: 0 4px 6px rgba(0,0,0,0.5), inset 0 0 15px rgba(0,255,255,0.1); }
    /* PREVINE CLIQUES NOS TEXTOS DOS BOTÕES - BUG FIX */
    .btn * { pointer-events: none; } 
    
    .btn:hover:not(:disabled) { background: #0ff; color: #000; box-shadow: 0 0 20px rgba(0,255,255,0.5); transform: translateY(-2px); }
    .btn:disabled { border-color: #333; color: #555; cursor: not-allowed; box-shadow: none; background: #0a0a0a; transform: none; }
    .btn-gold { border-color: #ffd700; color: #ffd700; box-shadow: 0 4px 6px rgba(0,0,0,0.5), inset 0 0 15px rgba(255,215,0,0.1); } .btn-gold:hover:not(:disabled) { background: #ffd700; color: #000; box-shadow: 0 0 20px rgba(255,215,0,0.5); }
    
    .menu-header { text-align: center; padding: 40px 0 20px 0; }
    .menu-header h1 { font-size: 60px; letter-spacing: 10px; color: #0ff; text-shadow: 0 0 30px #0ff, 0 5px 0 #005555; margin-bottom: 10px; transform: perspective(500px) rotateX(10deg); }
    .menu-nav { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
    
    .scroll-area { flex: 1; overflow-y: auto; padding: 0 40px 40px 40px; display: flex; flex-direction: column; align-items: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; width: 100%; max-width: 1000px; }
    .card { background: linear-gradient(145deg, #0a0a0e, #050508); border: 1px solid #333; padding: 15px; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; position: relative; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
    .card:hover { border-color: #0ff; transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,255,255,0.1); }
    .card h3 { font-size: 16px; margin-bottom: 5px; display: flex; justify-content: space-between; }
    
    .skill-tree { position: relative; width: 100%; max-width: 1000px; min-height: 500px; background: rgba(0,20,40,0.2); border: 1px solid #0ff; border-radius: 10px; margin-bottom: 30px; padding: 20px; box-shadow: inset 0 0 50px rgba(0,255,255,0.05); }
    .skill-node { background: linear-gradient(145deg, #222, #000); border: 2px solid #555; border-radius: 50%; width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; cursor: pointer; position: absolute; transition: 0.3s; z-index: 2; box-shadow: 0 5px 15px rgba(0,0,0,0.8); }
    .skill-node.unlocked { border-color: #0f0; background: rgba(0,255,0,0.1); box-shadow: 0 0 15px #0f0, inset 0 0 10px #0f0; }
    .skill-node.available { border-color: #ffd700; animation: pulse 2s infinite; }
    .skill-node:hover { transform: scale(1.15) translateY(-5px); }
    .skill-line { position: absolute; background: #333; height: 4px; transform-origin: 0 50%; z-index: 1; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
    .skill-line.unlocked { background: #0f0; box-shadow: 0 0 10px #0f0; }
    
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,215,0,0.7); } 70% { box-shadow: 0 0 0 15px rgba(255,215,0,0); } 100% { box-shadow: 0 0 0 0 rgba(255,215,0,0); } }
    
    #notif-box { position: absolute; top: 100px; right: 20px; width: 300px; display: flex; flex-direction: column; gap: 10px; pointer-events: none; z-index: 50; }
    .notif { background: linear-gradient(90deg, rgba(0,0,0,0.9), rgba(20,20,20,0.9)); border-left: 4px solid #ffd700; color: #fff; padding: 15px; border-radius: 4px; box-shadow: 0 10px 20px rgba(0,0,0,0.8); animation: slideIn 0.3s ease-out forwards; }
    @keyframes slideIn { from { transform: translateX(120%); } to { transform: translateX(0); } }
  </style>
</head>
<body>

<div id="app">
  <canvas id="gameCanvas"></canvas>
  <div id="notif-box"></div>
  
  <div id="hud" class="hud">
    <div class="top-bar">
      <div class="stat-box"><span style="font-size:12px; color:#aaa;">WAVE</span><span class="stat-val c-cyan" id="hud-wave">1</span></div>
      <div class="stat-box"><span style="font-size:12px; color:#aaa;">ENEMIES</span><span class="stat-val" id="hud-timer">0</span></div>
      <div class="stat-box"><span style="font-size:12px; color:#aaa;">CASH</span><span class="stat-val c-green" id="hud-cash">$0</span></div>
      <div class="stat-box"><span style="font-size:12px; color:#aaa;">COINS</span><span class="stat-val c-gold" id="hud-coins">0</span></div>
    </div>
    
    <!-- STATS UI -->
    <div id="stats-ui">
      <div class="stat-row"><span>DAMAGE:</span> <span id="st-dmg" class="c-cyan">0</span></div>
      <div class="stat-row"><span>FIRE RATE:</span> <span id="st-spd" class="c-cyan">0/s</span></div>
      <div class="stat-row"><span>ARMOR:</span> <span id="st-hp" class="c-green">0 / 0</span></div>
      <div class="stat-row"><span>REGEN:</span> <span id="st-reg" class="c-green">0/s</span></div>
    </div>

    <!-- TARGET UI -->
    <div id="target-ui">
      <div id="t-name">TARGET: ---</div>
      <div id="t-hp-bar"><div id="t-hp-fill"></div></div>
      <div id="t-hp-text">0 / 0 HP</div>
    </div>

    <!-- SLIDING UPGRADE PANEL -->
    <div id="upg-panel" class="closed">
      <div id="upg-toggle" onclick="toggleUpgPanel()">UPGRADES &#9660;</div>
      <div id="upg-content"></div>
    </div>
  </div>

  <div id="menu" class="layer active-layer">
    <div class="menu-header">
      <h1>NEON TOWER</h1>
      <p style="color:#0ff; letter-spacing: 5px; font-weight: bold;">3D APEX EDITION</p>
    </div>
    <div class="menu-nav">
      <button class="btn btn-gold" onclick="switchTab('workshop')">WORKSHOP</button>
      <button class="btn btn-gold" onclick="switchTab('skills')">SKILL TREE</button>
      <button class="btn btn-gold" onclick="switchTab('achievements')">ACHIEVEMENTS</button>
      <button class="btn" style="border-color:#ff3366; color:#ff3366;" onclick="resetSave()">WIPE SAVE</button>
    </div>
    <div class="top-bar" style="justify-content: center; gap: 50px; background: transparent; border: none; margin-bottom: 20px;">
      <div class="stat-box"><span style="font-size:14px; color:#aaa;">GLOBAL COINS</span><span class="stat-val c-gold" id="menu-coins">0</span></div>
      <div class="stat-box"><span style="font-size:14px; color:#aaa;">HIGHEST WAVE</span><span class="stat-val c-cyan" id="menu-wave">1</span></div>
    </div>
    
    <div id="tab-workshop" class="scroll-area"><div class="grid" id="ws-grid"></div></div>
    <div id="tab-skills" class="scroll-area" style="display:none;"><div class="skill-tree" id="skill-tree-container"></div></div>
    <div id="tab-achievements" class="scroll-area" style="display:none;"><div class="grid" id="achv-grid"></div></div>
    
    <div style="padding: 20px; text-align: center; background: #000; border-top: 1px solid #333; z-index: 10;">
      <button class="btn" style="font-size: 24px; padding: 15px 60px;" onclick="startGame()">DEPLOY TOWER</button>
    </div>
  </div>

  <div id="gameover" class="layer" style="justify-content: center; align-items: center;">
    <h1 style="color: #ff3366; text-shadow: 0 0 40px #ff3366; font-size: 70px; margin-bottom: 20px; transform: perspective(500px) rotateX(10deg);">DESTROYED</h1>
    <div style="background: rgba(0,0,0,0.8); padding: 30px; border: 1px solid #ff3366; border-radius: 10px; text-align: center; margin-bottom: 40px; box-shadow: 0 15px 30px rgba(0,0,0,0.8);">
      <h2 style="color: #fff; margin-bottom: 10px;">Mission Report</h2>
      <p style="font-size: 20px; color: #aaa; margin-bottom: 5px;">Wave Reached: <span class="c-cyan" id="go-wave">1</span></p>
      <p style="font-size: 20px; color: #aaa; margin-bottom: 20px;">Enemies Killed: <span id="go-kills" style="color:#fff;">0</span></p>
      <p style="font-size: 30px; font-weight: bold;">Profit: <span class="c-gold" id="go-coins">+0 COINS</span></p>
    </div>
    <button class="btn" style="font-size: 20px; padding: 15px 50px;" onclick="returnToMenu()">RETURN TO BASE</button>
  </div>
</div>

<script>
  /** CORE ENGINE & DATA **/
  const SAVE_KEY = "NeonTowerApexSave_FinalVersion";
  const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
  
  let tower = null; 
  let isUpgOpen = false;

  function toggleUpgPanel() {
    isUpgOpen = !isUpgOpen;
    const panel = document.getElementById('upg-panel');
    const toggleBtn = document.getElementById('upg-toggle');
    if(isUpgOpen) {
      panel.classList.add('open');
      toggleBtn.innerHTML = 'CLOSE &#9650;';
    } else {
      panel.classList.remove('open');
      toggleBtn.innerHTML = 'UPGRADES &#9660;';
    }
  }

  function resize() { 
    canvas.width = canvas.parentElement.clientWidth; 
    canvas.height = canvas.parentElement.clientHeight; 
  }
  window.addEventListener('resize', resize); resize();
  
  const MathUtils = {
    dist: (x1, y1, x2, y2) => Math.hypot(x2-x1, y2-y1),
    angle: (x1, y1, x2, y2) => Math.atan2(y2-y1, x2-x1)
  };

  /** AUDIO SYSTEM **/
  const AudioSys = {
    ctx: null, master: null,
    init() {
      if(this.ctx) return; 
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.3; this.master.connect(this.ctx.destination);
    },
    play(type, freqStart, freqEnd, typeW, duration, vol) {
      if(!this.ctx || this.ctx.state !== 'running') return;
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
      osc.type = typeW; osc.frequency.setValueAtTime(freqStart, t);
      if(freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, t + duration);
      gain.gain.setValueAtTime(vol, t); gain.gain.exponentialRampToValueAtTime(0.01, t + duration);
      osc.connect(gain); gain.connect(this.master); osc.start(t); osc.stop(t + duration);
    },
    shoot() { this.play('shoot', 600, 100, 'square', 0.1, 0.2); },
    laser() { this.play('laser', 1200, 400, 'sawtooth', 0.3, 0.1); },
    missile() { this.play('missile', 200, 50, 'sine', 0.4, 0.3); },
    hit() { this.play('hit', 150, 40, 'triangle', 0.2, 0.4); },
    explosion() { this.play('exp', 100, 20, 'sawtooth', 0.5, 0.5); },
    coin() { this.play('coin', 1000, 1500, 'sine', 0.1, 0.1); }
  };

  /** DATABASE EN **/
  const statDefs = {
    damage: { n: "DAMAGE", d: "Base firepower.", b: 15, i: 5, c: 10, cm: 1.15, isD: false, col: "#0ff" },
    speed:  { n: "FIRE RATE", d: "Shots per second.", b: 1.5, i: 0.2, c: 15, cm: 1.25, isD: true, col: "#0ff" },
    hp:     { n: "ARMOR", d: "Max tower health.", b: 200, i: 30, c: 10, cm: 1.15, isD: false, col: "#0f0" },
    regen:  { n: "REGEN", d: "Health recovery/sec.", b: 0, i: 1, c: 25, cm: 1.3, isD: true, col: "#0f0" },
    critC:  { n: "CRIT CHANCE", d: "% to deal critical hit.", b: 0, i: 5, c: 50, cm: 1.4, isD: false, col: "#ff3366", max: 10 },
    critD:  { n: "CRIT DMG", d: "Critical multiplier.", b: 1.5, i: 0.2, c: 50, cm: 1.4, isD: true, col: "#ff3366" },
    range:  { n: "RADAR", d: "Detection range.", b: 300, i: 50, c: 30, cm: 1.2, isD: false, col: "#ffd700", max: 10 }
  };

  const skillDefs = {
    'start':     { id: 'start', x: 500, y: 400, req: null, cost: 0, n: 'Core', d: 'Base system.' },
    'multishot': { id: 'multishot', x: 500, y: 300, req: 'start', cost: 100, n: 'Multi-Shot', d: '+1 Projectile.' },
    'missiles':  { id: 'missiles', x: 350, y: 300, req: 'multishot', cost: 500, n: 'Missiles', d: 'Guided AoE damage.' },
    'lasers':    { id: 'lasers', x: 650, y: 300, req: 'multishot', cost: 500, n: 'Lasers', d: 'Piercing beam.' },
    'shield':    { id: 'shield', x: 500, y: 500, req: 'start', cost: 200, n: 'Shield', d: 'Absorbs 1 hit/10s.' },
    'thorn':     { id: 'thorn', x: 350, y: 500, req: 'shield', cost: 400, n: 'Thorns', d: 'Reflects 50% dmg.' }
  };

  const achvDefs = [
    { id: 'w10', n: 'Survivor', d: 'Reach Wave 10.', req: () => player.highestWave >= 10, r: 100 },
    { id: 'w30', n: 'Veteran', d: 'Reach Wave 30.', req: () => player.highestWave >= 30, r: 500 },
    { id: 'k100', n: 'Hunter', d: 'Kill 100 Enemies.', req: () => player.totalKills >= 100, r: 50 }
  ];

  /** SAVE SYSTEM **/
  let player = { coins: 0, highestWave: 1, totalKills: 0, bossKills: 0, ws: {}, skills: ['start'], achievements: [] };
  let run = { stats: {}, cash: 0, coins: 0, wave: 1, kills: 0 };
  let targetEnemy = null; 

  function saveGame() { localStorage.setItem(SAVE_KEY, btoa(JSON.stringify(player))); checkAchievements(); updateMenuUI(); }
  function loadGame() { 
    const s = localStorage.getItem(SAVE_KEY); 
    if(s) { let p = JSON.parse(atob(s)); player = { ...player, ...p }; player.ws = { ...player.ws, ...p.ws }; }
    Object.keys(statDefs).forEach(k => { if(player.ws[k]===undefined) player.ws[k]=0; });
    updateMenuUI(); buildSkillTree();
  }
  function resetSave() { if(confirm("Delete all progress?")) { localStorage.removeItem(SAVE_KEY); location.reload(); } }

  function checkAchievements() {
    achvDefs.forEach(a => {
      if(!player.achievements.includes(a.id) && a.req()) {
        player.achievements.push(a.id); player.coins += a.r;
        notify("🏆 ACHIEVEMENT!", `${a.n} (+${a.r} Coins)`); saveGame();
      }
    });
  }

  function notify(title, msg) {
    const box = document.getElementById('notif-box');
    const el = document.createElement('div'); el.className = 'notif'; el.innerHTML = `<h4>${title}</h4><p>${msg}</p>`;
    box.appendChild(el); setTimeout(() => { el.style.opacity = 0; setTimeout(()=>el.remove(), 300); }, 3000);
  }

  function getVal(k, wsO=false) { const d=statDefs[k]; let l=player.ws[k]+(wsO?0:(run.stats[k]||0)); let v=d.b+(l*d.i); return d.isD?v.toFixed(2):Math.floor(v); }
  function getCost(k, isW) { const d=statDefs[k]; let l=isW?player.ws[k]:(run.stats[k]||0); return Math.floor(d.c*Math.pow(d.cm, l)); }
  function hasSkill(id) { return player.skills.includes(id); }

  /** ENTITIES & TOP-DOWN 3D GRAPHICS **/
  let game = { running: false, dt: 0, last: 0, shake: 0, spawnT: 0, toSpawn: 0, ents: { e:[], p:[], part:[], txt:[] }, cx: 0, cy: 0 };

  function drawTopDown3D(ctx, x, y, r, color, type) {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 10; ctx.shadowOffsetX = 3; ctx.shadowOffsetY = 5;
    
    if(type === 'Tank') {
      let grad = ctx.createLinearGradient(x-r, y-r, x+r, y+r);
      grad.addColorStop(0, '#fff'); grad.addColorStop(0.2, color); grad.addColorStop(1, '#222');
      ctx.fillStyle = grad;
      ctx.beginPath(); 
      if (ctx.roundRect) ctx.roundRect(x-r, y-r, r*2, r*2, 6); else ctx.rect(x-r, y-r, r*2, r*2);
      ctx.fill();
    } else {
      let grad = ctx.createRadialGradient(x - r*0.3, y - r*0.3, r*0.1, x, y, r);
      grad.addColorStop(0, '#fff'); grad.addColorStop(0.3, color); grad.addColorStop(1, '#111');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  class Tower {
    constructor() {
      this.x = game.cx || canvas.width/2; this.y = game.cy || canvas.height/2; this.r = 35;
      this.maxHp = parseFloat(getVal('hp')); this.hp = this.maxHp; 
      this.cdBase = 0; this.cdMissile = 0; this.cdLaser = 0; this.angle = 0;
      this.shield = hasSkill('shield'); this.shieldCd = 0;
    }
    update(dt) {
      let reg = parseFloat(getVal('regen')); if(reg>0 && this.hp<this.maxHp) this.hp = Math.min(this.maxHp, this.hp + reg*dt);
      if(this.shieldCd > 0) this.shieldCd -= dt; else if(hasSkill('shield')) this.shield = true;
      
      let targets = game.ents.e.filter(e => MathUtils.dist(this.x, this.y, e.x, e.y) < parseFloat(getVal('range')));
      
      if(targets.length > 0) {
        // Ordenar os alvos pelo mais próximo para focar sempre no mais perto
        targets.sort((a, b) => {
           let distA = MathUtils.dist(this.x, this.y, a.x, a.y);
           let distB = MathUtils.dist(this.x, this.y, b.x, b.y);
           return distA - distB;
        });
        
        targetEnemy = targets[0]; 
        this.angle = MathUtils.angle(this.x, this.y, targetEnemy.x, targetEnemy.y); 
      } else { targetEnemy = null; }

      this.cdBase -= dt;
      if(this.cdBase <= 0 && targetEnemy) {
        AudioSys.shoot();
        let shots = hasSkill('multishot') ? 2 : 1; let spread = 0.2;
        let startA = this.angle - (spread*(shots-1))/2;
        let dmg = parseFloat(getVal('damage')); let critC = parseFloat(getVal('critC')); let critD = parseFloat(getVal('critD'));
        for(let i=0; i<shots; i++) {
          let isC = (Math.random()*100) < critC; let finalD = isC ? dmg*critD : dmg;
          game.ents.p.push(new Projectile(this.x, this.y, startA + (spread*i), finalD, isC, 'base'));
        }
        this.cdBase = 1 / parseFloat(getVal('speed'));
      }

      if(hasSkill('missiles') && targetEnemy) {
        this.cdMissile -= dt;
        if(this.cdMissile <= 0) {
          AudioSys.missile();
          game.ents.p.push(new Missile(this.x, this.y, this.angle + (Math.random()-0.5), parseFloat(getVal('damage'))*2, targetEnemy));
          this.cdMissile = 2.0;
        }
      }

      if(hasSkill('lasers') && targetEnemy) {
        this.cdLaser -= dt;
        if(this.cdLaser <= 0) {
          AudioSys.laser();
          game.ents.p.push(new Laser(this.x, this.y, this.angle, parseFloat(getVal('damage'))*0.5, 0.5));
          this.cdLaser = 4.0;
        }
      }
    }
    draw() {
      ctx.save(); ctx.translate(this.x, this.y); 
      
      ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 15;
      ctx.beginPath(); ctx.arc(0, 0, this.r+10, 0, Math.PI*2);
      ctx.fillStyle = '#112'; ctx.fill();
      ctx.strokeStyle = '#0ff'; ctx.lineWidth = 2; ctx.stroke();
      
      if(this.shield) { 
        ctx.beginPath(); ctx.arc(0,0, this.r+25, 0, Math.PI*2); 
        ctx.strokeStyle="rgba(0,255,255,0.6)"; ctx.lineWidth=3; ctx.stroke(); 
      }
      ctx.rotate(this.angle);
      
      ctx.shadowBlur = 10; ctx.shadowColor = '#000'; ctx.shadowOffsetX = 5; ctx.shadowOffsetY = 5;
      ctx.fillStyle = '#334'; ctx.fillRect(0, -8, this.r+15, 16);
      ctx.fillStyle = '#0ff'; ctx.fillRect(this.r, -4, 15, 8);
      
      let grad = ctx.createRadialGradient(-this.r*0.2, -this.r*0.2, this.r*0.1, 0, 0, this.r);
      grad.addColorStop(0, '#556'); grad.addColorStop(1, '#112');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(0, 0, this.r, 0, Math.PI*2); ctx.fill();
      
      ctx.fillStyle = '#0ff'; ctx.beginPath(); ctx.arc(0, 0, this.r*0.4, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      
      const bw = 80; ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(this.x-bw/2, this.y-this.r-25, bw, 8);
      ctx.fillStyle = "#0f0"; ctx.fillRect(this.x-bw/2, this.y-this.r-25, bw*(this.hp/this.maxHp), 8);
    }
    hit(dmg, attacker) {
      if(this.shield) { this.shield = false; this.shieldCd = 10; game.shake = 0.3; createParts(this.x, this.y, "#0096ff", 20, 5); return; }
      this.hp -= dmg; game.shake = 0.5; AudioSys.hit();
      game.ents.txt.push(new FText(this.x, this.y-40, `-${Math.floor(dmg)}`, "#f00", 24));
      
      if(hasSkill('thorn') && attacker) { attacker.hit(dmg * 0.5); createParts(this.x, this.y, "#fff", 10, 3); }
      if(this.hp <= 0) processGameOver();
    }
  }

  class Enemy {
    constructor(w) {
      let a = Math.random()*Math.PI*2; let d = Math.max(canvas.width, canvas.height)/2 + 50;
      this.x = game.cx + Math.cos(a)*d; this.y = game.cy + Math.sin(a)*d;
      
      let rand = Math.random(); this.type = "Minion"; this.c = "#ff0055"; this.r = 15;
      let hm = 1, sm = 1, cm = 1;
      
      if(game.toSpawn === 1 && w % 5 === 0) { this.type="Boss"; this.c="#9900ff"; this.r=35; hm=25; sm=0.4; cm=30; notify("WARNING", "BOSS!"); }
      else if(w > 2 && rand < 0.2) { this.type="Tank"; this.c="#ffaa00"; this.r=22; hm=4; sm=0.5; cm=3; }
      else if(w > 4 && rand < 0.4) { this.type="Scout"; this.c="#0088ff"; this.r=10; hm=0.5; sm=2.0; cm=1.5; }

      this.maxHp = (20 * Math.pow(1.2, w)) * hm; this.hp = this.maxHp;
      this.dmg = (5 * Math.pow(1.15, w)) * hm; this.spd = (40 + (w*1.5)) * sm;
      this.val = Math.floor(4 * Math.pow(1.1, w) * cm);
    }
    update(dt) { 
      let a = MathUtils.angle(this.x, this.y, tower.x, tower.y); 
      this.x += Math.cos(a)*this.spd*dt; this.y += Math.sin(a)*this.spd*dt; 
    }
    draw() {
      drawTopDown3D(ctx, this.x, this.y, this.r, this.c, this.type);
      
      if(targetEnemy !== this) {
         ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(this.x-15, this.y-this.r-15, 30, 5);
         ctx.fillStyle = "#f00"; ctx.fillRect(this.x-15, this.y-this.r-15, 30*(this.hp/this.maxHp), 5);
      } else {
         ctx.strokeStyle = "#ff3366"; ctx.lineWidth = 2;
         ctx.beginPath(); ctx.arc(this.x, this.y, this.r+8, 0, Math.PI*2); ctx.stroke();
      }
    }
    hit(dmg) {
      this.hp -= dmg;
      if(this.hp <= 0) {
        AudioSys.explosion(); run.kills++; player.totalKills++; run.cash += this.val;
        if(this.type === 'Boss') { player.bossKills++; run.coins += 15; game.shake = 1.0; createParts(this.x,this.y,this.c, 60, 8, 2); }
        else { createParts(this.x,this.y,this.c, 15, 4); if(Math.random() < 0.05) run.coins++; }
        checkAchievements(); return true; 
      }
      return false;
    }
  }

  class Projectile {
    constructor(x, y, a, d, c, t) { this.x=x; this.y=y; this.a=a; this.d=d; this.c=c; this.type=t; this.spd=900; this.r=4; this.dead=false; }
    update(dt) { this.x += Math.cos(this.a)*this.spd*dt; this.y += Math.sin(this.a)*this.spd*dt; createParts(this.x, this.y, "#0ff", 1, 0, 0.1); }
    draw() { 
      ctx.shadowBlur=10; ctx.shadowColor="#0ff"; ctx.fillStyle = this.c ? "#fff" : "#0ff"; 
      ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
    }
    collide(e) { if(MathUtils.dist(this.x, this.y, e.x, e.y) < this.r + e.r) { this.dead=true; return true; } return false; }
  }

  class Missile {
    constructor(x, y, a, d, target) { this.x=x; this.y=y; this.a=a; this.d=d; this.target=target; this.spd=400; this.r=6; this.dead=false; this.life=5; }
    update(dt) {
      this.life -= dt; if(this.life <= 0) this.dead = true;
      if(this.target && this.target.hp > 0) {
        let ta = MathUtils.angle(this.x, this.y, this.target.x, this.target.y);
        let da = ta - this.a; while(da > Math.PI) da -= Math.PI*2; while(da < -Math.PI) da += Math.PI*2;
        this.a += da * 5 * dt;
      }
      this.x += Math.cos(this.a)*this.spd*dt; this.y += Math.sin(this.a)*this.spd*dt;
      createParts(this.x, this.y, "#ffaa00", 3, 2, 0.4);
    }
    draw() { ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.a); ctx.shadowBlur=5; ctx.shadowColor="#ffaa00"; ctx.fillStyle="#fff"; ctx.fillRect(-5,-3,10,6); ctx.restore(); }
    
    collide(e, entsList) { 
      if(MathUtils.dist(this.x, this.y, e.x, e.y) < this.r + e.r) { 
        this.dead=true; game.shake=0.3; createParts(this.x, this.y, "#ffaa00", 40, 8, 0.5); AudioSys.explosion(); 
        entsList.forEach(en => {
           if(MathUtils.dist(this.x, this.y, en.x, en.y) < 100) { en.hit(this.d); game.ents.txt.push(new FText(en.x, en.y, Math.floor(this.d), "#ffaa00", 18)); }
        });
        return true;
      } 
      return false; 
    }
  }

  class Laser {
    constructor(x, y, a, d, dur) { this.x=x; this.y=y; this.a=a; this.d=d; this.dur=dur; this.maxDur=dur; this.dead=false; this.hitList=new Set(); }
    update(dt) { this.x = tower.x; this.y = tower.y; this.dur -= dt; if(this.dur <= 0) this.dead = true; this.hitList.clear(); }
    draw() { 
      ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.a); ctx.shadowBlur = 10; ctx.shadowColor = "#f00";
      ctx.fillStyle = `rgba(255, 0, 0, ${this.dur/this.maxDur})`; ctx.fillRect(0, -10, 2000, 20); 
      ctx.fillStyle = `rgba(255, 255, 255, ${this.dur/this.maxDur})`; ctx.fillRect(0, -3, 2000, 6); 
      ctx.restore();
    }
    collide(e) {
      if(this.hitList.has(e)) return false; 
      let dx = Math.cos(this.a), dy = Math.sin(this.a); let v = (e.x - this.x)*dx + (e.y - this.y)*dy;
      if(v > 0) {
        let px = this.x + dx*v, py = this.y + dy*v;
        if(MathUtils.dist(e.x, e.y, px, py) < e.r + 15) { this.hitList.add(e); return true; }
      }
      return false;
    }
  }

  class Part {
    constructor(x,y,c,s,l) { this.x=x; this.y=y; this.c=c; this.a=Math.random()*Math.PI*2; this.s=Math.random()*s; this.l=l; this.ml=l; }
    update(dt) { this.x+=Math.cos(this.a)*this.s*dt; this.y+=Math.sin(this.a)*this.s*dt; this.l-=dt; this.s*=0.95; }
    draw() { ctx.globalAlpha=Math.max(0,this.l/this.ml); ctx.fillStyle=this.c; ctx.fillRect(this.x,this.y,4,4); ctx.globalAlpha=1; }
  }
  class FText {
    constructor(x,y,t,c,s=14) { this.x=x+(Math.random()*20-10); this.y=y; this.t=t; this.c=c; this.s=s; this.l=1; }
    update(dt) { this.y-=50*dt; this.l-=dt; }
    draw() { ctx.globalAlpha=Math.max(0,this.l); ctx.fillStyle=this.c; ctx.font=`bold ${this.s}px Orbitron`; ctx.fillText(this.t,this.x,this.y); ctx.globalAlpha=1; }
  }
  function createParts(x,y,c,n,s,l=0.5) { for(let i=0;i<n;i++) game.ents.part.push(new Part(x,y,c,s*60,l)); }

  /** MENUS & HUD **/
  function switchTab(t) { ['workshop', 'skills', 'achievements'].forEach(x => document.getElementById('tab-'+x).style.display = (x===t?'flex':'none')); }
  
  function updateMenuUI() {
    document.getElementById('menu-coins').innerText = player.coins;
    document.getElementById('menu-wave').innerText = player.highestWave;
    
    let ws = document.getElementById('ws-grid'); ws.innerHTML = "";
    Object.keys(statDefs).forEach(k => {
      let d = statDefs[k], lvl = player.ws[k]||0, cost = getCost(k, true), val = getVal(k, true), isMax = d.max && lvl >= d.max;
      ws.innerHTML += `<div class="card">
        <div><h3><span style="color:${d.col}">${d.n}</span> <span>Lvl.${lvl}</span></h3><p>${d.d}<br><br><span style="color:#fff;">Current: ${val}</span></p></div>
        <button class="btn btn-gold" ${player.coins<cost||isMax?'disabled':''} onclick="buyWs('${k}')">${isMax?'MAX':`UPGRADE - ${cost} C`}</button>
      </div>`;
    });

    let ach = document.getElementById('achv-grid'); ach.innerHTML = "";
    achvDefs.forEach(a => {
      let done = player.achievements.includes(a.id);
      ach.innerHTML += `<div class="card" style="border-color:${done?'#0f0':'#333'}">
        <h3 style="color:${done?'#0f0':'#fff'}">${a.n} ${done?'(DONE)':''}</h3>
        <p>${a.d}</p><p class="c-gold">+${a.r} COINS</p>
      </div>`;
    });
  }

  function buildSkillTree() {
    let container = document.getElementById('skill-tree-container'); container.innerHTML = "";
    Object.values(skillDefs).forEach(s => {
      let unlocked = hasSkill(s.id);
      let avail = !unlocked && (s.req === null || hasSkill(s.req));
      if(s.req) {
        let parent = skillDefs[s.req];
        let dist = MathUtils.dist(parent.x+30, parent.y+30, s.x+30, s.y+30);
        let ang = MathUtils.angle(parent.x+30, parent.y+30, s.x+30, s.y+30);
        container.innerHTML += `<div class="skill-line ${unlocked?'unlocked':''}" style="width:${dist}px; left:${parent.x+30}px; top:${parent.y+30}px; transform:rotate(${ang}rad);"></div>`;
      }
      container.innerHTML += `<div class="skill-node ${unlocked?'unlocked':''} ${avail?'available':''}" style="left:${s.x}px; top:${s.y}px;" onclick="buySkill('${s.id}')" title="Cost: ${s.cost} Coins">
        <span style="font-size:10px; font-weight:bold; color:${unlocked?'#0f0':(avail?'#ffd700':'#555')}">${s.n.substring(0,4)}</span>
      </div>`;
    });
  }

  function buyWs(k) { let c = getCost(k, true); if(player.coins >= c) { player.coins -= c; player.ws[k]=(player.ws[k]||0)+1; saveGame(); } }
  function buySkill(id) {
    let s = skillDefs[id]; if(hasSkill(id)) return;
    if(player.coins >= s.cost) { player.coins -= s.cost; player.skills.push(id); saveGame(); buildSkillTree(); AudioSys.coin(); }
  }

  function initUpgBar() {
    let ub = document.getElementById('upg-content'); ub.innerHTML = "";
    Object.keys(statDefs).forEach(k => {
      let btn = document.createElement("button");
      btn.className = "btn upg-btn";
      btn.id = "btn-upg-" + k;
      btn.onclick = () => buyRunUpg(k);
      ub.appendChild(btn);
    });
  }

  function updateHUD() {
    document.getElementById('hud-wave').innerText = run.wave;
    document.getElementById('hud-timer').innerText = game.toSpawn + game.ents.e.length;
    document.getElementById('hud-cash').innerText = '$'+run.cash;
    document.getElementById('hud-coins').innerText = run.coins;
    
    if (tower) {
      document.getElementById('st-dmg').innerText = getVal('damage');
      document.getElementById('st-spd').innerText = getVal('speed') + '/s';
      document.getElementById('st-hp').innerText = `${Math.ceil(Math.max(0, tower.hp))} / ${getVal('hp')}`;
      document.getElementById('st-reg').innerText = getVal('regen') + '/s';
    }

    const tui = document.getElementById('target-ui');
    if(targetEnemy) {
       tui.classList.add('visible');
       document.getElementById('t-name').innerText = `TARGET: ${targetEnemy.type}`;
       let hpPct = Math.max(0, (targetEnemy.hp / targetEnemy.maxHp) * 100);
       document.getElementById('t-hp-fill').style.width = hpPct + '%';
       document.getElementById('t-hp-text').innerText = `${Math.ceil(Math.max(0, targetEnemy.hp))} / ${Math.ceil(targetEnemy.maxHp)} HP`;
    } else {
       tui.classList.remove('visible');
    }
    
    Object.keys(statDefs).forEach(k => {
      let d=statDefs[k], l=run.stats[k]||0, c=getCost(k, false), m=d.max&&l>=d.max;
      let btn = document.getElementById('btn-upg-' + k);
      if(btn) {
         btn.disabled = (run.cash < c) || m;
         btn.innerHTML = `<span style="color:${d.col}">${d.n} (Lvl ${l})</span> <span style="color:#0f0;">$${m?'MAX':c}</span>`;
      }
    });
  }
  
  function buyRunUpg(k) {
    let c = getCost(k, false); if(run.cash >= c) { run.cash -= c; run.stats[k] = (run.stats[k]||0)+1; 
    if(k==='hp'){ let o=tower.maxHp; tower.maxHp=parseFloat(getVal('hp')); tower.hp+=(tower.maxHp-o); } updateHUD(); AudioSys.coin(); }
  }

  /** MAIN LOOP & RENDERING **/
  function startGame() {
    AudioSys.init();
    document.getElementById('menu').classList.remove('active-layer'); document.getElementById('hud').classList.add('active-hud');
    run = { stats: {}, cash: 0, coins: 0, wave: 1, kills: 0 };
    Object.keys(statDefs).forEach(k => run.stats[k]=0);
    
    game = { running: true, dt: 0, last: performance.now(), shake: 0, spawnT: 0, toSpawn: 10, ents: { e:[], p:[], part:[], txt:[] }, cx: canvas.width/2, cy: canvas.height/2 };
    
    tower = new Tower(); 
    initUpgBar();
    updateHUD();
    requestAnimationFrame(loop);
  }

  function processGameOver() {
    game.running = false; document.getElementById('hud').classList.remove('active-hud'); document.getElementById('gameover').classList.add('active-layer');
    document.getElementById('go-wave').innerText = run.wave; document.getElementById('go-kills').innerText = run.kills; document.getElementById('go-coins').innerText = "+"+run.coins+" COINS";
    player.coins += run.coins; if(run.wave > player.highestWave) player.highestWave = run.wave; saveGame();
  }
  function returnToMenu() { document.getElementById('gameover').classList.remove('active-layer'); document.getElementById('menu').classList.add('active-layer'); updateMenuUI(); }

  let bgOffset = 0;
  function drawGrid(dt) {
    bgOffset = (bgOffset + 20 * dt) % 40;
    ctx.lineWidth = 1;
    let camOffsetX = (canvas.width/2 - game.cx) % 40;

    for(let y = 0; y < canvas.height; y+=40) {
      let alpha = y/canvas.height; ctx.strokeStyle = `rgba(0, 255, 255, ${0.1 * alpha})`;
      ctx.beginPath(); ctx.moveTo(0, (y + bgOffset)); ctx.lineTo(canvas.width, (y + bgOffset)); ctx.stroke();
    }
    for(let x = -40; x < canvas.width + 40; x+=40) {
      ctx.strokeStyle = `rgba(0, 255, 255, 0.05)`;
      ctx.beginPath(); ctx.moveTo(x + camOffsetX, 0); ctx.lineTo(x + camOffsetX, canvas.height); ctx.stroke();
    }
  }

  function loop(ts) {
    if(!game.running) return; requestAnimationFrame(loop);
    game.dt = (ts - game.last)/1000; if(game.dt > 0.1) game.dt = 0.1; game.last = ts;

    let panelWidth = 300;
    let targetCx = isUpgOpen ? (canvas.width - panelWidth) / 2 : canvas.width / 2;
    
    // Deslize da câmara
    let prevCx = game.cx;
    game.cx += (targetCx - game.cx) * 6 * game.dt;
    let shiftX = game.cx - prevCx;

    // Deslize das entidades
    if (Math.abs(shiftX) > 0.01) {
      game.ents.e.forEach(ent => ent.x += shiftX);
      game.ents.p.forEach(ent => ent.x += shiftX);
      game.ents.part.forEach(ent => ent.x += shiftX);
      game.ents.txt.forEach(ent => ent.x += shiftX);
    }

    game.cy = canvas.height / 2;
    tower.x = game.cx;
    tower.y = game.cy;

    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawGrid(game.dt);
    
    if(game.shake > 0) { game.shake -= game.dt; let mx = (Math.random()-0.5)*20; let my = (Math.random()-0.5)*20; canvas.style.transform = `translate(${mx}px, ${my}px)`; } 
    else { canvas.style.transform = "translate(0,0)"; }

    if(game.toSpawn <= 0 && game.ents.e.length === 0) {
      run.wave++; game.toSpawn = 10 + Math.floor(run.wave * 2);
      run.coins += Math.floor(run.wave/2) + 2; updateHUD(); AudioSys.coin(); checkAchievements(); 
    }
    game.spawnT -= game.dt;
    if(game.spawnT <= 0 && game.toSpawn > 0) { game.ents.e.push(new Enemy(run.wave)); game.toSpawn--; game.spawnT = Math.max(0.1, 1.2 - (run.wave*0.05)); updateHUD(); }

    tower.update(game.dt); tower.draw();

    for(let i = game.ents.p.length - 1; i >= 0; i--) {
      let p = game.ents.p[i]; p.update(game.dt); p.draw();
      if(p.x<0||p.x>canvas.width||p.y<0||p.y>canvas.height || p.dead) { game.ents.p.splice(i,1); continue; }
      
      let hitSomething = false;
      for(let j = game.ents.e.length - 1; j >= 0; j--) {
        let e = game.ents.e[j];
        if(p instanceof Missile) {
            if(p.collide(e, game.ents.e)) { hitSomething = true; break; }
        } 
        else if(p.collide(e)) {
          let dmg = p instanceof Laser ? p.d * game.dt : p.d;
          if(!(p instanceof Laser)) {
             game.ents.txt.push(new FText(e.x, e.y-e.r, Math.floor(dmg), p.crit ? "#ff3366" : "#fff", p.crit ? 24 : 14));
             createParts(p.x, p.y, p.crit ? "#ff3366" : "#0ff", p.crit?10:3, 3);
          }
          if(e.hit(dmg)) { game.ents.e.splice(j,1); updateHUD(); }
          
          if(p instanceof Laser) { /* Pierce */ } 
          else { hitSomething = true; break; }
        }
      }
      if(hitSomething) game.ents.p.splice(i,1);
    }

    for(let i = game.ents.e.length - 1; i >= 0; i--) {
      let e = game.ents.e[i];
      if(e.hp <= 0) { game.ents.e.splice(i,1); continue; } 
      e.update(game.dt); e.draw();
      if(MathUtils.dist(e.x, e.y, tower.x, tower.y) < tower.r + e.r) { tower.hit(e.dmg, e); game.ents.e.splice(i,1); updateHUD(); }
    }
    
    for(let i = game.ents.part.length - 1; i >= 0; i--) { let p = game.ents.part[i]; p.update(game.dt); p.draw(); if(p.l<=0) game.ents.part.splice(i,1); }
    for(let i = game.ents.txt.length - 1; i >= 0; i--) { let t = game.ents.txt[i]; t.update(game.dt); t.draw(); if(t.l<=0) game.ents.txt.splice(i,1); }
    
    updateHUD(); 
  }

  loadGame();
</script>
