<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Neon Tower: Apex - Top-Down 3D</title>
  
  <!-- Ícone do jogo (Favicon SVG) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' stroke='%230ff' stroke-width='10' fill='none'/><circle cx='50' cy='50' r='15' fill='%23ff3366'/></svg>">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <canvas id="gameCanvas"></canvas>
  <div id="notif-box"></div>
  
  <div id="hud" class="hud">
    <div class="top-bar">
      <div class="stat-box"><span style="font-size:12px; color:#aaa;">WAVE</span><span class="stat-val c-cyan" id="hud-wave">1</span></div>
      <div class="stat-box"><span style="font-size:12px; color:#aaa;">ENEMIES</span><span class="stat-val" id="hud-timer">0</span></div>
      <div class="stat-box"><span style="font-size:12px; color:#aaa;">CASH</span><span class="stat-val c-green" id="hud-cash">$0</span></div>
      <div class="stat-box"><span style="font-size:12px; color:#aaa;">COINS</span><span class="stat-val c-gold" id="hud-coins">0</span></div>
    </div>
    
    <!-- STATS UI -->
    <div id="stats-ui">
      <div class="stat-row"><span>DAMAGE:</span> <span id="st-dmg" class="c-cyan">0</span></div>
      <div class="stat-row"><span>FIRE RATE:</span> <span id="st-spd" class="c-cyan">0/s</span></div>
      <div class="stat-row"><span>ARMOR:</span> <span id="st-hp" class="c-green">0 / 0</span></div>
      <div class="stat-row"><span>REGEN:</span> <span id="st-reg" class="c-green">0/s</span></div>
    </div>

    <!-- TARGET UI -->
    <div id="target-ui">
      <div id="t-name">TARGET: ---</div>
      <div id="t-hp-bar"><div id="t-hp-fill"></div></div>
      <div id="t-hp-text">0 / 0 HP</div>
    </div>

    <!-- SLIDING UPGRADE PANEL -->
    <div id="upg-panel" class="closed">
      <div id="upg-toggle" onclick="toggleUpgPanel()">UPGRADES &#9660;</div>
      <div id="upg-content"></div>
    </div>
  </div>

  <div id="menu" class="layer active-layer">
    <div class="menu-header">
      <h1>NEON TOWER</h1>
      <p style="color:#0ff; letter-spacing: 5px; font-weight: bold;">3D APEX EDITION</p>
    </div>
    <div class="menu-nav">
      <button class="btn btn-gold" onclick="switchTab('workshop')">WORKSHOP</button>
      <button class="btn btn-gold" onclick="switchTab('skills')">SKILL TREE</button>
      <button class="btn btn-gold" onclick="switchTab('achievements')">ACHIEVEMENTS</button>
      <button class="btn" style="border-color:#ff3366; color:#ff3366;" onclick="resetSave()">WIPE SAVE</button>
    </div>
    <div class="top-bar" style="justify-content: center; gap: 50px; background: transparent; border: none; margin-bottom: 20px;">
      <div class="stat-box"><span style="font-size:14px; color:#aaa;">GLOBAL COINS</span><span class="stat-val c-gold" id="menu-coins">0</span></div>
      <div class="stat-box"><span style="font-size:14px; color:#aaa;">HIGHEST WAVE</span><span class="stat-val c-cyan" id="menu-wave">1</span></div>
    </div>
    
    <div id="tab-workshop" class="scroll-area"><div class="grid" id="ws-grid"></div></div>
    <div id="tab-skills" class="scroll-area" style="display:none;"><div class="skill-tree" id="skill-tree-container"></div></div>
    <div id="tab-achievements" class="scroll-area" style="display:none;"><div class="grid" id="achv-grid"></div></div>
    
    <div style="padding: 20px; text-align: center; background: #000; border-top: 1px solid #333; z-index: 10;">
      <button class="btn" style="font-size: 24px; padding: 15px 60px;" onclick="startGame()">DEPLOY TOWER</button>
    </div>
  </div>

  <div id="gameover" class="layer" style="justify-content: center; align-items: center;">
    <h1 style="color: #ff3366; text-shadow: 0 0 40px #ff3366; font-size: 70px; margin-bottom: 20px; transform: perspective(500px) rotateX(10deg);">DESTROYED</h1>
    <div style="background: rgba(0,0,0,0.8); padding: 30px; border: 1px solid #ff3366; border-radius: 10px; text-align: center; margin-bottom: 40px; box-shadow: 0 15px 30px rgba(0,0,0,0.8);">
      <h2 style="color: #fff; margin-bottom: 10px;">Mission Report</h2>
      <p style="font-size: 20px; color: #aaa; margin-bottom: 5px;">Wave Reached: <span class="c-cyan" id="go-wave">1</span></p>
      <p style="font-size: 20px; color: #aaa; margin-bottom: 20px;">Enemies Killed: <span id="go-kills" style="color:#fff;">0</span></p>
      <p style="font-size: 30px; font-weight: bold;">Profit: <span class="c-gold" id="go-coins">+0 COINS</span></p>
    </div>
    <button class="btn" style="font-size: 20px; padding: 15px 50px;" onclick="returnToMenu()">RETURN TO BASE</button>
  </div>
</div>

<script src="entidades.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
